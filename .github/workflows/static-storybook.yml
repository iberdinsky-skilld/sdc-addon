# GitHub Action for deploying Storybook to GitHub Pages
name: Deploy Storybook to GitHub Pages

on:
  # Runs on pushes to the main branch
  push:
    branches: ['main']

  # Release commits made by `auto` carry [skip ci], which suppresses the push
  # trigger for the whole push. Redeploy when the GitHub release is published.
  release:
    types: [published]

  # Allows manual triggering from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build addon
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Storybook artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'storybook-static' # Specify the Storybook output directory

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
