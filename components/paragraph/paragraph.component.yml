# This is so your IDE knows about the syntax for fixes and autocomplete.
$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

# The human readable name.
name: Paragraph

# Status can be: "experimental", "stable", "deprecated", "obsolete".
status: stable

# Schema for the props. We support www.json-schema.org. Learn more about the
# syntax there.
props:
  type: object
  properties:
    extra_classes:
      type: array
      items:
        type: string
      default: []
    label:
      type: string
      title: Title
      examples:
        - Paragraph title
slots:
  content:
    title: Content
    examples:
      - Lorem ipsum dolor sit amet, euripidis voluptatum nam ex, ullum hendrerit pertinacia vim et. Ex habeo ponderum sapientem has, id vide utamur gloriatur cum. Per quas diceret cu. Ea mea noster ancillae, per et audiam impedit habemus, ad aperiam offendit persecuti qui. Ei consul copiosae eos. Ex sed quaeque senserit.

thirdPartySettings:
  sdcStorybook:
    stories:
      grid:
        props:
          label: Paragraph with grid
          extra_classes:
            - m-paragraph--grid
        slots:
          content:
            - type: component
              component: 'umami:card'
            - type: component
              component: 'umami:card'
              story: Preview
            - type: component
              component: 'umami:card'
              props:
                html_tag: 'div'
              slots:
                content: 'Hello from third grid card!'
      badges:
        props:
          label: Paragraph with badges
          extra_classes:
            - m-paragraph--badges
        slots:
          content:
            - type: component
              component: 'umami:badge'
              props:
                icon: 'knife'
            - type: component
              component: 'umami:badge'
              props:
                icon: 'timer'
            - type: component
              component: 'umami:badge'
              props:
                icon: 'serves'
            - type: component
              component: 'umami:badge'
              props:
                icon: 'difficulty'
      nodes:
        name: Story nodes
        props:
          label: Paragraph with story nodes
        slots:
          content:
            - type: element
              tag: h3
              value: '<span>type: element</span>'
              attributes:
                class: custom-class
            - type: image
              uri: 'https://placehold.co/600x200?text=type:+image'
            - type: icon
              pack_id: heroicons_cdn
              icon_id: star
      dark:
        name: Dark theme global
        globals:
          theme: dark
        props:
          label: Paragraph on the dark theme
